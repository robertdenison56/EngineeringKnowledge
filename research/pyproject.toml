[project]
name = "caltrans-bench"
version = "0.1.0"
description = "Retrieval-grounded benchmark and evaluation harness over Caltrans design standards (EKG Research Arc 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "inspect-ai>=0.3",
  "pymupdf>=1.25",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.9",
  "openai>=1.50",
]

[project.optional-dependencies]
# Dense retrieval and the reranker fine-tune pull in torch; keep them out of
# the default install so the CI smoke pass stays small.
dense = ["sentence-transformers>=3.0"]
finetune = ["sentence-transformers>=3.0", "datasets>=2.20", "accelerate>=1.0"]

[project.scripts]
caltrans-bench = "caltrans_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caltrans_bench"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
